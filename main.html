<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <h1 class="heading">Rock Paper Scissor</h1>
    <div class="choices">
        <div class="choice" id="rock">
            <img src="/images/rock.png"  class="icons">
        </div>
        <div class="choice" id="paper">
            <img src="/images/paper.png"  class="icons">
        </div>
        <div class="choice" id="scissor">
            <img src="/images/scissors.png" class="icons">
        </div>
    </div>
    <div class="results">
        <div class="userResult">
            <p id="userNum" class="nums">0</p>
            <p class="para">User</p>
        </div>
        <div class="compResult">
            <p id="compNum" class="nums">0</p>
            <p class="para">Comp</p>
        </div>
    </div>
    <h1 class="desc">Press any icon</h1>
    <script src="script.js"></script>
</body>
</html>
